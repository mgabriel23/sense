<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sense — Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div id="app">
    <header class="options-header">
      <div class="brand">Sense</div>
      <p class="subtitle">
        Customize the devices offered in each category. Changes save automatically and apply
        the next time you open a preview.
      </p>
    </header>

    <main id="categories" class="categories"></main>

    <footer class="options-footer">
      <button id="reset-all" type="button" class="btn btn-ghost">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3.5-7.1"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </span>
        Reset all categories to defaults
      </button>
    </footer>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
