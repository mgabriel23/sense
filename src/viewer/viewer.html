<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sense — Multi-Screen Preview</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand">Sense</div>

      <form id="url-form" class="url-form" autocomplete="off">
        <div class="url-input-wrap">
          <input
            id="url-input"
            type="text"
            name="url"
            placeholder="Enter a website URL to preview it on mobile, tablet, laptop, and desktop at once"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="recent-urls-menu" class="recent-urls-menu" hidden></ul>
        </div>
        <button type="submit" class="btn btn-primary">View</button>
      </form>

      <div class="toolbar-actions">
        <button id="reload-all" type="button" class="btn" title="Reload all screens" disabled>
          Reload
        </button>
        <button id="theme-toggle" type="button" class="btn icon-btn toolbar-icon-btn"></button>
        <button
          id="tour-help"
          type="button"
          class="btn icon-btn toolbar-icon-btn"
          title="Show the guided tour"
          aria-label="Show the guided tour"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
      </div>
    </header>

    <p id="url-error" class="url-error" hidden></p>

    <div class="category-toggles-row">
      <div id="category-toggles" class="category-toggles"></div>
      <span class="category-toggles-hint">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Click to show or hide
      </span>
    </div>

    <main id="grid" class="grid" hidden></main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
