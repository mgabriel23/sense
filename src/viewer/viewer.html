<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sense — Multi-Screen Preview</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand">Sense</div>

      <form id="url-form" class="url-form" autocomplete="off">
        <div class="url-input-wrap">
          <input
            id="url-input"
            type="text"
            name="url"
            placeholder="Enter a website URL to preview it on mobile, tablet, laptop, and desktop at once"
            aria-label="Website URL to preview"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="recent-urls-menu" class="recent-urls-menu" hidden></ul>
        </div>
        <button type="submit" class="btn btn-primary" title="Load the preview across all four screens">View</button>
      </form>

      <div class="toolbar-actions">
        <button id="reload-all" type="button" class="btn" title="Reload all screens" disabled>
          Reload
        </button>
        <button
          id="export-all"
          type="button"
          class="btn icon-btn toolbar-icon-btn"
          title="Export all screens as one image"
          aria-label="Export all screens as one image"
          disabled
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button id="theme-toggle" type="button" class="btn icon-btn toolbar-icon-btn btn-ghost"></button>
        <button
          id="tour-help"
          type="button"
          class="btn icon-btn toolbar-icon-btn btn-ghost"
          title="Show the guided tour"
          aria-label="Show the guided tour"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
        <button
          id="open-settings"
          type="button"
          class="btn icon-btn toolbar-icon-btn btn-ghost"
          title="Open Sense settings"
          aria-label="Open Sense settings"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <p id="url-error" class="url-error" role="alert" hidden></p>

    <div class="category-toggles-row">
      <div id="category-toggles" class="category-toggles"></div>
      <span class="category-toggles-hint">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Click to show or hide
      </span>
    </div>

    <main id="grid" class="grid" hidden></main>

    <div id="empty-state" class="empty-state">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
        <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
        <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
        <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
      </svg>
      <p>Enter a website URL above to preview it across four screen sizes at once.</p>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
